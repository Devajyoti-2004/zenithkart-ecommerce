<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874F0" />
      <stop offset="50%" stop-color="#1A56C4" />
      <stop offset="100%" stop-color="#0C3483" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Modern Dynamic Shopping Icon -->
  <g transform="translate(6, 7)" filter="url(#glow)">
    <!-- Shopping Bag / Modern Hexagon -->
    <rect x="6" y="14" width="44" height="42" rx="10" fill="url(#logoGrad)" />
    <!-- Bag Handle -->
    <path d="M18 14 V10 C18 4, 38 4, 38 10 V14" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round" />
    <!-- Electric Speed Z Bolt -->
    <path d="M33 22 L21 34 H31 L23 48 L37 32 H27 Z" fill="#FFFFFF" />
    <!-- Sparkle accent -->
    <circle cx="43" cy="18" r="3" fill="#FF9900" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 48)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0F172A">Zenith</tspan><tspan fill="#2874F0">Kart</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="3" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#FF8800" letter-spacing="1.5">
      INDIA'S MEGA STORE • 1000+ PRODUCTS
    </text>
    <!-- Smile swoosh under brand -->
    <path d="M70 -3 Q95 8 135 -1" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
